name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:

  # -------------------------------------------------------------
  # 1. SAST (Static Application Security Testing) using Semgrep
  # -------------------------------------------------------------
  sast-semgrep:
    name: Semgrep Code Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default  # Standard recommended security ruleset

  # -------------------------------------------------------------
  # 2. SCA (Software Composition Analysis) using Snyk
  # -------------------------------------------------------------
  sca-snyk:
    name: Snyk Dependency Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master  # Replace 'node' with your language (e.g., python, maven)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

  # -------------------------------------------------------------
  # 3. Infrastructure as Code (IaC) Scan using tfsec
  # -------------------------------------------------------------
  iac-tfsec:
    name: tfsec Terraform Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: '.'  # Path to your Terraform files

  # -------------------------------------------------------------
  # 4. Container & Infrastructure Scan using Checkov
  # -------------------------------------------------------------
  container-checkov:
    name: Checkov Container & Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: dockerfile # Scans Dockerfiles (can also use 'all')
          output_format: cli
          soft_fail: true # Set to true if you don't want pipeline to fail on error

  # -------------------------------------------------------------
  # 5. DAST (Dynamic Application Security Testing) using OWASP ZAP
  # -------------------------------------------------------------
  dast-zap:
    name: OWASP ZAP Web Application Scan (DAST)
    runs-on: ubuntu-latest
    # DAST requires the app to be running first
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: Build and run your application container locally first so ZAP can scan it
      - name: Build and start app
        run: |
          docker build -t my-app .
          docker run -d -p 3000:3000 my-app
          sleep 10 # Wait for app to start up

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000' # Target URL of your running application
          fail_action: false # Set to true to fail build on high-risk vulnerabilities
