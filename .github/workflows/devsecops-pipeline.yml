name: DevSecOps Security Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write
  issues: write

jobs:

  # -------------------------------------------------------------
  # 1. SAST (Static Application Security Testing) using Semgrep
  # -------------------------------------------------------------
# -------------------------------------------------------------
  # 1. SAST (Static Application Security Testing) using Semgrep
  # -------------------------------------------------------------
  sast-semgrep:
    name: Semgrep Code Scan (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
          generateSarif: "1"

      - name: Check if SARIF contains findings
        id: check_sarif
        run: |
          if [ -f semgrep.sarif ]; then
            # Count the number of results in the SARIF file using node/jq
            RESULTS_COUNT=$(node -e '
              try {
                const sarif = require("./semgrep.sarif");
                const count = (sarif.runs && sarif.runs[0] && sarif.runs[0].results) ? sarif.runs[0].results.length : 0;
                console.log(count);
              } catch(e) {
                console.log(0);
              }
            ')
            echo "findings_count=$RESULTS_COUNT" >> $GITHUB_OUTPUT
          else
            echo "findings_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.check_sarif.outputs.findings_count != '0'
        with:
          sarif_file: semgrep.sarif
  # -------------------------------------------------------------
  # 2. SCA (Software Composition Analysis) using Snyk
  # -------------------------------------------------------------
  sca-snyk:
    name: Snyk Dependency Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test

  # -------------------------------------------------------------
  # 3. Infrastructure as Code (IaC) Scan using tfsec
  # -------------------------------------------------------------
  iac-tfsec:
    name: tfsec Terraform Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tfsec SARIF report generator
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          sarif_file: tfsec.sarif

      - name: Upload tfsec SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: tfsec.sarif

  # -------------------------------------------------------------
  # 4. Container & Infrastructure Scan using Checkov
  # -------------------------------------------------------------
  container-checkov:
    name: Checkov Container & Config Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          framework: dockerfile
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true

      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov.sarif

  # -------------------------------------------------------------
  # 5. DAST (Dynamic Application Security Testing) using OWASP ZAP
  # -------------------------------------------------------------
# -------------------------------------------------------------
  # 5. DAST (Dynamic Application Security Testing) using OWASP ZAP
  # -------------------------------------------------------------
  # -------------------------------------------------------------
  # 5. DAST (Dynamic Application Security Testing) using OWASP ZAP
  # -------------------------------------------------------------
  dast-zap:
    name: OWASP ZAP Web Application Scan (DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

# Set up workspace permissions if ZAP writes as a non-root user inside Docker
      - name: Create and set workspace permissions for ZAP
        run: |
          mkdir -p zap
          chmod 777 zap
      # Run the ZAP Baseline Scan
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'https://example.com' # Replace with your target application URL
          cmd_options: '-a'

          # Upload ZAP Report as an Artifact
      - name: Upload ZAP Report
        if: always() # Upload even if scan finds warnings or errors
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report # Must use dashes/underscores without invalid API characters
          path: |
            zap/report_html.html
            zap/report_json.json
            zap/report_md.md
